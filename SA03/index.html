<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>NewsToday</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>

<body>
    <!-- ------------------------Inicio do header------------------------>
    <header>

        <section class="logo">
            <div>
                <img src="img/nova_logo.png" alt="logo News Today">
            </div>
            <!-- <h1>NewsToday - o seu portal de notícias</h1> -->
            <input type="text" placeholder="Pesquisar notícias...">
        </section>


        <span class="hamburger">☰</span>
        <nav class="menu">
            <a href="#tecnologia">Tecnologia</a>
            <a href="#esportes">Esportes</a>
            <a href="#economia">Economia</a>
            <a href="#contato">Contato</a>
            <a id="relogio"></a>
            <a id="clima"></a>
        </nav>
    </header>
    <!--------------- fim do header --------------------------------->
    <!-- começo do principal -->
    <main>
        <div class="conteudo">
            <div class="noticias-esquerda">
                <section id="tecnologia">
                </section>
            </div>
        </div>

    </main>


    <footer>
        NewsToday © 2026 - Informação em tempo real
    </footer>
    <script src="script.js"></script>
</body>

</html>
