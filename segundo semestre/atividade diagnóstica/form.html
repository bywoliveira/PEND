<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
    <!-- link do css -->
    <link rel="icon" type="image/png" href="img/icon.png">
    <!-- link do favicon, um icone para colocar uma logo no site na aba do google -->
</head>

<body>
    <section>
        <h2>• Formulário de contato •</h2>

        <form>

            <h4>Nome:</h4>
            <input type="text" id="nome" placeholder="Digite um nome.."><br>
            <p id="paragrafoh"></p>
            <!-- Foi feito um input para o nome, onde já defini o id(para uso do js) e coloquei o placeholder -->
            <!-- para aparecer uma mensagem que naquele input é o nome -->
            <!-- o id "paragrafoh" é um id para aparecer uma mensagem caso o usuário não tenha preenchido seu nome -->

            <h4>E-mail:</h4>
            <input type="text" id="email" placeholder="Digite um e-mail.."><br>
            <p id="mensagem_email"></p>
            <!-- Foi criado um input e-mail, com id email para futuras verificações e um placeholder com mesmo intuito do de nome -->
            <!-- um paragrafo mensagem_email, para mostra quando o e-mail está errado ou não preenchido -->


            <button type="button" id="botao">Enviar</button>
            <!-- pra clicar e vai ser o principal para as verificaçõs de campos vazios -->
            <p id="mensagemfinal"></p>


        </form>
    </section>
    <script src="script.js"></script>
    <!-- link para o js conseguir aparecer  -->
</body>

</html>
